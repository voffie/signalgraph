name: Setup
description: Install pnpm, Node, and dependencies.
inputs:
  node-version:
    description: The version of Node to install
    required: false

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Install node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version || '24' }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
